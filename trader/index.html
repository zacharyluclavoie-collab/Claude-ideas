<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper Trader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Trader">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<style>
/* Layout: sticky status bar, one scrolling column of cards, bottom tab bar. Dark trading-terminal look, semantic green/red only for P&L and state. */
:root{--bg:#0a0e15;--card:#121a27;--card2:#0e1520;--line:#223049;--tx:#e8edf6;--mut:#8593ab;--g:#2fd196;--r:#ff5f70;--y:#f4b942;--b:#62a8ff;--btn:#1f2d47;--btnr:#59212e;--btng:#1c4a39;--ban:#16233b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-variant-numeric:tabular-nums}
.banner{background:var(--ban);color:var(--b);font-size:11.5px;text-align:center;padding:7px 10px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 10px;letter-spacing:.05em}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:12px;color:var(--mut);font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.09em}
h2{font-size:12px;color:var(--mut);font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.09em}
.eq{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sm{font-size:12px;color:var(--mut)}.k{font-size:12px;color:var(--mut)}.v{font-size:18px;font-weight:650}
.g{color:var(--g)}.r{color:var(--r)}.y{color:var(--y)}.b{color:var(--b)}
.chip{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;background:#17382d;color:var(--g);white-space:nowrap}
.chip.bad{background:#47202a;color:var(--r)}.chip.warn{background:#45381a;color:var(--y)}.chip.info{background:#1b2f4d;color:var(--b)}.chip.dim{background:#1a2230;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
.tile .v{overflow-wrap:anywhere}
.m{margin:9px 0}.ml{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:4px}.ml span:last-child{color:var(--tx)}
.mb{height:7px;background:var(--card2);border-radius:99px;overflow:hidden}.mb i{display:block;height:100%;border-radius:99px;background:var(--g)}.mb i.y{background:var(--y)}.mb i.r{background:var(--r)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:9px 4px;border-radius:8px;font-size:13.5px;font-weight:650;min-height:38px}
.seg button.on{background:var(--btn);color:var(--tx)}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.funnel div{background:var(--card2);border-radius:10px;padding:8px 2px}.funnel b{display:block;font-size:18px}.funnel span{font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pc{border-top:1px solid var(--line);padding:12px 0}.pc:first-of-type{border-top:0;padding-top:2px}
.ladder{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,#4a2230 0 var(--se),#243049 var(--se) var(--tp1),#1b4a3a var(--tp1) 100%);margin:12px 4px 6px}
.ladder u{position:absolute;top:-3px;width:2px;height:14px;background:var(--tx);opacity:.55;text-decoration:none}
.ladder s{position:absolute;top:-5px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--b);border:2px solid var(--bg)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px;margin-top:8px}.kv div span{display:block;font-size:11px;color:var(--mut)}.kv div b{font-size:13px;font-weight:600}
.fe{border-top:1px solid var(--line);padding:10px 0}.fe:first-of-type{border-top:0}
.fe .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fe .d{font-size:12.5px;color:var(--mut);margin-top:3px;overflow-wrap:anywhere}
.chk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 10px;margin-top:8px;font-size:12px}.chk span{overflow-wrap:anywhere}
.log{font:12px/1.4 ui-monospace,Menlo,monospace;border-top:1px solid var(--line);padding:7px 0;overflow-wrap:anywhere}.log:first-child{border-top:0}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}.bar i{display:block;height:9px;border-radius:5px;background:var(--b);min-width:3px}.bar span:first-child{width:112px;color:var(--mut);flex:none}
.chartbox svg{display:block;border-radius:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:13px 0 12px;font-size:12.5px;font-weight:650;min-height:48px}
nav button.on{color:var(--tx);box-shadow:inset 0 2px 0 var(--b)}
.btn{background:var(--btn);color:var(--tx);border:0;border-radius:11px;padding:13px 14px;font-size:15px;font-weight:650;width:100%;margin:5px 0;min-height:46px}
.btn.red{background:var(--btnr)}.btn.grn{background:var(--btng)}
input[type=number]{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:16px;width:100%}
input[type=range]{width:100%;accent-color:var(--b)}
.sl{margin:12px 0}.sl .ml span:last-child{font-weight:700}
.tab{display:none}.tab.on{display:block}
button:focus-visible,input:focus-visible{outline:2px solid var(--b);outline-offset:2px}
@media (min-width:640px){body{max-width:640px;margin:0 auto}}
@media (prefers-reduced-motion:no-preference){.mb i{transition:width .3s}}

</style>
</head>
<body>
<div class="banner" id="banner">PAPER TRADING · SIMULATED MONEY ONLY · NO WALLET · NOT FINANCIAL ADVICE</div>
<div class="top">
  <div><h1>Paper Trader</h1><div class="eq" id="eq">$0</div><div class="sm" id="ret"></div></div>
  <div style="text-align:right"><span id="chip" class="chip dim">…</span><div class="sm" id="clock" style="margin-top:6px"></div></div>
</div>

<section id="t-over" class="tab on">
  <div class="card chartbox"><h2>Equity curve</h2><div id="chart"></div><div class="sm" id="chartnote"></div></div>
  <div class="tiles">
    <div class="tile"><div class="k">Cash</div><div class="v" id="cash"></div></div>
    <div class="tile"><div class="k">In positions</div><div class="v" id="expo"></div></div>
    <div class="tile"><div class="k">Realized P&amp;L</div><div class="v" id="real"></div></div>
    <div class="tile"><div class="k">Win rate</div><div class="v" id="wr"></div></div>
  </div>
  <div class="card"><h2>Risk limits <span class="sm" style="text-transform:none;letter-spacing:0">(hard-coded, strategy cannot override)</span></h2><div id="meters"></div></div>
  <div class="card"><h2>Market regime</h2><div id="reg"></div></div>
  <div class="card"><h2>What the bot just did</h2><div id="now"></div></div>
</section>

<section id="t-pos" class="tab">
  <div class="seg" id="segpos"><button data-s="open" class="on">Open</button><button data-s="trades">Trades</button></div>
  <div class="card" id="poslist"></div>
</section>

<section id="t-scan" class="tab">
  <div class="card"><h2>Pipeline</h2><div class="funnel" id="funnel"></div><div class="sm" id="funnelnote" style="margin-top:8px"></div></div>
  <div class="seg" id="segscan"><button data-s="cand" class="on">Candidates</button><button data-s="events">Events</button></div>
  <div class="card" id="scanlist"></div>
</section>

<section id="t-stats" class="tab">
  <div class="tiles" id="stiles"></div>
  <div class="card"><h2>Exits</h2><div id="exits"></div></div>
  <div class="card"><h2>By strategy</h2><div id="bycat"></div></div>
  <div class="card" id="protect"></div>
</section>

<section id="t-set" class="tab">
  <div class="card" id="setcard"></div>
</section>

<nav id="nav"><button data-t="over" class="on">Overview</button><button data-t="pos">Positions</button><button data-t="scan">Scanner</button><button data-t="stats">Stats</button><button data-t="set">Settings</button></nav>

<script>
"use strict";
/* ============================ config (mirrors paper_trader/config.py) ============================ */
const CFG = {
  chains:["solana","base","ethereum","bsc"],
  tick:5, monitorEvery:15, newEvery:30, trendEvery:120, recheckEvery:300, regimeEvery:120, equityEvery:300,
  maxCands:10, rejectMin:45,
  risk:{perTradePct:0.5, posTrend:2, posNew:1, totalExp:30, newExp:10, chainExp:15, cashReserve:20, maxPos:8,
        liqFrac:0.02, minTrade:25, dailyLoss:3, maxDD:12, maxTotalLoss:20, streakPause:3, pauseMin:60,
        perHour:4, perDay:20, cooldownH:12, maxRisk:45, minRR:1.5},
  sec:{buyTax:5, sellTax:8, liqNew:15000, liqTrend:100000, holdersNew:100, holdersTrend:500, top10:45, creator:8, owner:8, lpLocked:70, volLiq:40},
  nw:{minAgeMin:10, maxAgeH:24, minTx:50, minBP:0.55, maxChg1h:300, maxFdvLiq:60, minScore:60, stop:18, tp1:40, tp2:100, trail:15, maxHoldH:12},
  tr:{minAgeH:72, minVol:150000, minAccel:1.5, minBP:0.52, maxChg24:150, minScore:62, stop:10, tp1:20, tp2:45, trail:8, maxHoldH:48},
  tp1Frac:0.5, tp2Frac:0.25,
  em:{liqTotal:0.5, liqStep:0.3, priceStep:0.3, staleCycles:8, staleHaircut:0.5, maxAttempts:12, danger:-3, crash:-8, regimeUnknownMin:15},
  ex:{fee:0.30, gas:{ethereum:6,base:0.05,bsc:0.15,solana:0.02,arbitrum:0.1}, fail:0.03, newFail:0.05, partial:0.10, maxBuySlip:4, maxSellSlip:8, maxEmSlip:30}
};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEMO_ONLY=false;
const freshStats=()=>({scanned:0,strat:0,sec:0,vetoed:0,bought:0,scamSeen:0,scamBought:0,junkSeen:0,seen:{}});
const $ = id => document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=(n,d=2)=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n)=>(n>=0?"+":"")+n.toFixed(2)+"%";
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SEED=7,rng=mulberry(7);
const gauss=()=>{let u=0,v=0;while(!u)u=rng();v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

/* ============================ state ============================ */
let MODE=DEMO_ONLY?"mock":(LS.get("pt_mode")||"live"),SPEED=+LS.get("pt_speed")||60;
let paused=false, vnow=1.76e9, last={}, regime="unknown", regimeOk=0, rejected={}, stats=freshStats();
let S; // {pf, journal[], trades[]}
const key=()=>"pt_state_"+MODE;
function newState(cap){return{feed:[],pf:{feesPaid:0,start:cap,cash:cap,positions:{},realized:0,peak:cap,day:"",dayStart:cap,streak:0,pauseUntil:0,entries:[],cool:{},shutdown:false,why:"",closed:[]},journal:[],trades:[],curve:[]}}
function load(){S=null;if(MODE!=="mock"){try{S=JSON.parse(LS.get(key()))}catch(e){S=null}}if(!S)S=newState(+LS.get("pt_cap")||10000);if(!S.feed)S.feed=[];if(S.pf.feesPaid==null)S.pf.feesPaid=0}
function save(){if(MODE!=="mock")LS.set(key(),JSON.stringify(S))}
const now=()=>MODE==="mock"?vnow:Date.now()/1000;
function ev(level,kind,tok,msg){S.journal.unshift({t:now(),level,kind,tok,msg});if(S.journal.length>300)S.journal.length=300}

/* ============================ portfolio helpers ============================ */
const pv=p=>p.qty*p.last*(1-p.sellTax/100);
const exposure=()=>Object.values(S.pf.positions).reduce((a,p)=>a+pv(p),0);
const equity=()=>S.pf.cash+exposure();
const expBy=fn=>{const o={};for(const p of Object.values(S.pf.positions))o[fn(p)]=(o[fn(p)]||0)+pv(p);return o};

/* ============================ security (mirrors security.py) ============================ */
function evalSecurity(sec,snap,cat,t){
  const checks=[];const add=(n,ok)=>checks.push([n,!!ok,true]);
  if(!sec)return{pass:false,risk:100,fails:["security_data_available"],checks:[["security_data_available",false]]};
  const isNew=cat==="new",c=CFG.sec,f=(n,v)=>add(n,v===false);
  if(!sec.sol){f("not_honeypot",sec.honeypot);f("no_hidden_owner",sec.hiddenOwner);f("no_ownership_takeback",sec.takeBack);
    f("owner_cannot_change_balance",sec.ownerBal);f("transfers_not_pausable",sec.pausable);f("can_sell_all",sec.cannotSellAll);
    f("no_slippage_modification",sec.slipMod);f("no_selfdestruct",sec.selfdestruct);f("not_mintable",sec.mintable);
    f("no_blacklist",sec.blacklist);f("creator_no_honeypot_history",sec.creatorHP);add("contract_verified",sec.openSource===true);add("tradable_on_dex",sec.inDex===true)}
  else{f("not_mintable",sec.mintable);f("not_freezable",sec.freezable);f("not_closable",sec.closable);f("transferable",sec.nonTransferable);f("owner_cannot_change_balance",sec.ownerBal)}
  add("buy_tax",sec.buyTax!=null&&sec.buyTax<=c.buyTax);add("sell_tax",sec.sellTax!=null&&sec.sellTax<=c.sellTax);
  add("holders",sec.holders!=null&&sec.holders>=(isNew?c.holdersNew:c.holdersTrend));
  add("top10",sec.top10!=null&&sec.top10<=c.top10);
  for(const [n,v,l] of [["creator",sec.creator,c.creator],["owner",sec.owner,c.owner]]){if(v==null&&sec.sol)continue;add(n,v!=null&&v<=l)}
  add("liquidity",snap.liq>=(isNew?c.liqNew:c.liqTrend));
  const lp=sec.lpLocked;add("lp_locked",isNew?(lp!=null&&lp>=c.lpLocked):(lp==null||lp>=20||snap.liq>=1e6));
  add("sells_exist",!(snap.buys1h>=20&&snap.sells1h===0));
  add("no_wash",(snap.liq>0?snap.vol24/snap.liq:1e9)<=c.volLiq);
  add("no_vertical_pump",snap.chg1h<=1000&&snap.chg5m<=150);
  let r=Math.min(25,(sec.top10??50)*0.5)+Math.min(10,sec.creator??5)+Math.min(10,(sec.buyTax||0)+(sec.sellTax||0));
  r+=(sec.proxy?6:0)+(sec.extCall?4:0)+(sec.cooldown?5:0)+(sec.sol&&sec.creator==null?5:0)+(isNew?15:0);
  r+=snap.liq<30000?12:snap.liq<100000?6:0;r+=(sec.lpLocked||0)<90?5:0;r+=(sec.holders!=null&&sec.holders<300)?5:0;
  const age=snap.created?(t-snap.created)/3600:null;if(age!=null&&age<1)r+=8;
  const fails=checks.filter(x=>!x[1]).map(x=>x[0]);
  return{pass:!fails.length,risk:Math.min(100,r),fails,checks:checks.map(c=>[c[0],c[1]])};
}

/* ============================ strategy (mirrors strategy.py) ============================ */
const bp=s=>{const n=s.buys1h+s.sells1h;return n?s.buys1h/n:0};
const ageH=(s,t)=>s.created?Math.max(0,(t-s.created)/3600):null;
function mkPlan(s,cat,score,reason){const c=cat==="new"?CFG.nw:CFG.tr;
  const stop=clamp(Math.abs(s.chg1h)*0.4,c.stop,c.stop*2),tp1=Math.max(c.tp1,stop*2),tp2=Math.max(c.tp2,cat==="new"?tp1*2:tp1*2.2);
  return{stop,tp1,tp2,trail:c.trail,score,rr:tp1/stop,reason}}
function analyzeNew(s,t){const c=CFG.nw,rej=[],age=ageH(s,t);if(age==null)return[null,["unknown age"]];
  if(age*60<c.minAgeMin)rej.push("too young");if(age>c.maxAgeH)rej.push("not new");if(s.liq<CFG.sec.liqNew)rej.push("liquidity low");
  const tx=s.buys1h+s.sells1h;if(tx<c.minTx)rej.push("thin activity ("+tx+"/1h)");const b=bp(s);if(b<c.minBP)rej.push("weak buy pressure "+b.toFixed(2));
  if(s.chg1h>c.maxChg1h)rej.push("already pumped "+s.chg1h.toFixed(0)+"%");if(s.chg5m<-5)rej.push("dumping now");
  if(s.fdv>0&&s.liq>0&&s.fdv/s.liq>c.maxFdvLiq)rej.push("FDV/liq high");if(rej.length)return[null,rej];
  const vlr=s.vol1h/s.liq;let sc=clamp(Math.log10(s.liq/CFG.sec.liqNew+1)*25,0,25)+clamp((b-0.5)*120,0,20)+(vlr>=0.3&&vlr<=10?15:vlr<=25?5:0)
   +(s.chg6h>=0?clamp(s.chg1h*0.5,0,15):0)+(age>=0.5&&age<=8?10:5)+clamp(Math.log10(Math.max(tx,1)/c.minTx+1)*15,0,15);
  if(sc<c.minScore)return[null,["score "+sc.toFixed(0)+" < "+c.minScore]];
  return[mkPlan(s,"new",sc,`age=${age.toFixed(1)}h liq=${s.liq.toFixed(0)} bp=${b.toFixed(2)}`),[]]}
function analyzeTrend(s,t,breakout){const c=CFG.tr,rej=[],age=ageH(s,t);
  if(age==null||age<c.minAgeH)rej.push("insufficient history");if(s.liq<CFG.sec.liqTrend)rej.push("liquidity low");if(s.vol24<c.minVol)rej.push("volume low");
  const acc=s.vol24>0?s.vol1h*24/s.vol24:0;if(acc<c.minAccel)rej.push("no volume acceleration");const b=bp(s);if(b<c.minBP)rej.push("weak buy pressure");
  if(!(s.chg1h>=1&&s.chg1h<=25))rej.push("1h move outside 1..25%");if(s.chg6h<2)rej.push("6h trend weak");if(s.chg24>c.maxChg24)rej.push("overextended");
  if(s.chg5m<-1)rej.push("short-term weakness");if(rej.length)return[null,rej];
  const sc=clamp((acc-1)*20,0,25)+clamp((b-0.5)*150,0,20)+clamp(s.chg1h*1.2,0,15)+clamp(s.chg6h*0.6,0,10)+clamp(Math.log10(s.liq/CFG.sec.liqTrend+1)*20,0,15)+(breakout?15:breakout==null?0:-10);
  if(sc<c.minScore)return[null,["score "+sc.toFixed(0)+" < "+c.minScore]];
  return[mkPlan(s,"trending",sc,`accel=${acc.toFixed(1)}x bp=${b.toFixed(2)} breakout=${breakout}`),[]]}

/* ============================ risk manager (mirrors risk.py) ============================ */
function riskMult(){const pf=S.pf,eq=equity(),dd=Math.max(0,(pf.peak-eq)/pf.peak*100);let m=1-0.6*Math.min(1,dd/CFG.risk.maxDD);if(pf.streak>=2)m*=0.5;return clamp(m,0.1,1)}
function shutdownReason(){const pf=S.pf;if(pf.shutdown)return pf.why;const eq=equity();pf.peak=Math.max(pf.peak,eq);
  const dd=(pf.peak-eq)/pf.peak*100;if(dd>=CFG.risk.maxDD)return`max drawdown ${dd.toFixed(1)}%`;
  const loss=(pf.start-eq)/pf.start*100;if(loss>=CFG.risk.maxTotalLoss)return`total loss ${loss.toFixed(1)}%`;return""}
function approve(snap,cat,risk,plan,t){const R=CFG.risk,pf=S.pf,no=r=>({ok:false,why:r});
  if(pf.shutdown)return no("shutdown");if(!marketOk(t))return no("market regime");
  if(pf.dayStart>0&&(pf.dayStart-equity())/pf.dayStart*100>=R.dailyLoss)return no("daily loss limit");
  if(t<pf.pauseUntil)return no("paused after losses");const k=snap.chain+":"+snap.addr.toLowerCase();
  if(pf.positions[k])return no("already held");if(t<(pf.cool[k]||0))return no("re-entry cooldown");
  if(pf.entries.filter(x=>t-x<3600).length>=R.perHour)return no("hourly entry limit");if(pf.entries.filter(x=>t-x<86400).length>=R.perDay)return no("daily entry limit");
  if(Object.keys(pf.positions).length>=R.maxPos)return no("max positions");if(risk>R.maxRisk)return no("risk score "+risk.toFixed(0));if(plan.rr<R.minRR)return no("reward/risk");
  const eq=equity(),ex=exposure(),caps={risk:eq*R.perTradePct/100/(plan.stop/100)*riskMult(),pos:eq*(cat==="new"?R.posNew:R.posTrend)/100,

function simBuy(s,usd,tax,isNew){const x=CFG.ex,g=gas(s.chain);
  if(rng()<x.fail+(isNew?x.newFail:0))return{ok:false,why:"tx failed (dropped/reverted), gas burned",gas:g,fee:0,slip:0};
  const res=s.liq/2,lim=0.7*x.maxBuySlip/100,maxIn=res*lim/(1-lim);let partial=false,want=usd;
  if(usd>maxIn){usd=maxIn;partial=true}if(isNew&&rng()<x.partial){usd*=0.5+rng()*0.45;partial=true}
  if(usd<1)return{ok:false,why:"no executable size",gas:g,fee:0,slip:0};
  const slip=usd/(res+usd)+drift(s,true);if(slip*100>x.maxBuySlip)return{ok:false,why:`slippage ${(slip*100).toFixed(1)}% > limit`,gas:g,fee:0,slip:slip*100};
  const px=s.price*(1+slip),fee=usd*x.fee/100;
  return{ok:true,why:partial?"filled (partial)":"filled",qty:(usd-fee)/px*(1-tax/100),px,usd,fee,gas:g,slip:slip*100,partial}}
function simSell(s,qty,tax,urgent,attempt,blocked){const x=CFG.ex,g=gas(s.chain);
  if(blocked)return{ok:false,why:"sell reverted in pre-flight (token restricts selling); no gas",gas:0,fee:0,slip:0};
  if(rng()<x.fail*(urgent?2:1))return{ok:false,why:"tx failed (dropped/reverted), gas burned",gas:g,fee:0,slip:0};
  if(s.price<=0||s.liq<=0)return{ok:false,why:"no liquidity",gas:g,fee:0,slip:0};
  const res=s.liq/2,limit=Math.min((urgent?x.maxEmSlip:x.maxSellSlip)+attempt*2,60)/100,lim=0.7*limit,val=qty*s.price,maxVal=res*lim/(1-lim);let partial=false;
  let v=val;if(val>maxVal){qty*=maxVal/val;v=maxVal;partial=true}
  const slip=v/(res+v)+drift(s,true);if(slip>limit)return{ok:false,why:`slippage ${(slip*100).toFixed(1)}% > limit`,gas:g,fee:0,slip:slip*100};
  const px=s.price*(1-slip),gross=qty*px,fee=gross*x.fee/100;
  return{ok:true,why:partial?"filled (partial)":"filled",qty,px,usd:(gross-fee)*(1-tax/100),fee,gas:g,slip:slip*100,partial}}

  if(why&&!pf.shutdown){pf.shutdown=true;pf.why=why;ev("crit","shutdown","","EMERGENCY SHUTDOWN: "+why+" · flattening all positions")}

  if(source==="new")todo.sort((a,b)=>((b.snap&&b.snap.created)||0)-((a.snap&&a.snap.created)||0));todo.length=Math.min(todo.length,CFG.maxCands);
  const byChain={};for(const c of todo)(byChain[c.chain]=byChain[c.chain]||[]).push(c.addr);const fresh={};
  for(const ch in byChain){const r=await prov.snapshots(ch,byChain[ch]);for(const a in r)fresh[ch+":"+a]=r[a]}
  for(const c of todo){if(S.pf.shutdown)break;const k=c.chain+":"+c.addr.toLowerCase(),snap=fresh[k]||c.snap;stats.scanned++;if(!snap||snap.price<=0)continue;await evaluate(k,snap,source,t)}}
const SCAM=new Set(["rug","honeypot","stealth"]);

function feedAdd(snap,src,outcome,detail,extra){const k=snap.chain+":"+snap.addr.toLowerCase(),tr=truthOf(snap);
  if(tr&&!stats.seen[k]){stats.seen[k]=1;if(SCAM.has(tr))stats.scamSeen++;else if(tr==="dead")stats.junkSeen++}
  S.feed.unshift(Object.assign({t:now(),sym:snap.sym,chain:snap.chain,src,outcome,detail,truth:tr},extra||{}));if(S.feed.length>80)S.feed.length=80}
function reject(k,snap,src,why,min,stage,extra){rejected[k]=now()+60*(min||CFG.rejectMin);feedAdd(snap,src,stage||"strategy",why,extra)}
async function evaluate(k,snap,src,t){let plan,rej;
  [plan,rej]=src==="new"?analyzeNew(snap,t):analyzeTrend(snap,t,true);
  if(!plan)return reject(k,snap,src,rej.join("; "),rej.some(r=>r==="too young")?3:null);
  if(src==="trending"){const bo=await P().breakout(snap);[plan,rej]=analyzeTrend(snap,t,bo);if(!plan)return reject(k,snap,src,rej.join("; "))}

  $("exits").innerHTML=Object.entries(rs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${(v/mx*60).toFixed(0)}%"></i><span>${v}</span></div>`).join("")||'<div class="sm">No closed trades yet</div>';
  const bc={};for(const c of cl){const o=bc[c.cat]=bc[c.cat]||{n:0,p:0};o.n++;o.p+=c.pnl}
  $("bycat").innerHTML=Object.entries(bc).map(([k,o])=>`<div class="row" style="margin:6px 0"><span>${k==="new"?"New-token scanner":"Trending scanner"} <span class="sm">${o.n} trades</span></span><b class="${o.p>=0?"g":"r"}">${sgn(o.p)}</b></div>`).join("")||'<div class="sm">No closed trades yet</div>';
  $("protect").innerHTML=MODE==="mock"?`<h2>Scam protection (demo only)</h2><div class="row"><span>Rug / honeypot tokens seen</span><b>${stats.scamSeen}</b></div><div class="row" style="margin:6px 0"><span>Bought anyway</span><b class="${stats.scamBought?"r":"g"}">${stats.scamBought}</b></div><div class="row"><span>Low-quality junk tokens seen</span><b>${stats.junkSeen}</b></div><div class="sm" style="margin-top:8px">The demo market knows which tokens are scams; real markets do not. Hidden “stealth” honeypots pass security checks on purpose, so some can get through and the sell-failure handling has to contain the loss. This synthetic market is friendlier than a real one: do not read its profits as a forecast.</div>`
    :`<h2>Data health</h2><div class="sm">API calls ok ${health.ok} · failed ${health.fail}${health.lastErr?"<br>last error: "+esc(health.lastErr):""}</div>`}
function buildSettings(){let h=`<h2>Speed</h2>${MODE==="mock"?`<div class="seg" id="segspeed">${[1,15,60,300].map(s=>`<button data-v="${s}" class="${s===SPEED?"on":""}">${s}x</button>`).join("")}</div><div class="sm">The demo opens fresh each time. 60x is about one simulated hour per minute.</div>`:`<div class="sm">Live data runs in real time.</div>`}`;
  h+=`<!--LIVEONLY--><h2 style="margin-top:16px">Data source</h2><div class="seg" id="segmode"><button data-v="live" class="${MODE==="live"?"on":""}">Live market</button><button data-v="mock" class="${MODE==="mock"?"on":""}">Demo market</button></div><div class="sm">Each source keeps its own paper account.</div><!--/LIVEONLY-->`;
  h+=`<h2 style="margin-top:16px">Risk limits</h2>`+RK.map(([k,l,lo,hi,st])=>`<div class="sl"><div class="ml"><span>${l}</span><span id="v_${k}">${CFG.risk[k]}</span></div><input type="range" id="s_${k}" min="${lo}" max="${hi}" step="${st}" value="${CFG.risk[k]}" aria-label="${l}"></div>`).join("")+`<div class="sm">Ranges stop at safe maximums. Changes apply to future decisions only.</div>`;
  h+=`<h2 style="margin-top:16px">Account</h2><div class="k">Starting capital (used on reset)</div><input type="number" id="cap" inputmode="numeric" value="${LS.get("pt_cap")||10000}" aria-label="Starting capital"><button class="btn grn" id="toggle">${paused?"Resume scanning":"Pause scanning"}</button><button class="btn red" id="kill">EMERGENCY STOP (flatten + halt entries)</button><button class="btn" id="rearm">Re-arm after shutdown</button><button class="btn" id="reset">Reset paper account</button>`;
  h+=`<div class="sm" style="margin-top:10px">${MODE==="mock"?"Demo mode runs entirely in this page.":"iPhone: iOS freezes web pages when the screen locks, so the bot only trades while this app is open (a screen wake lock is requested). For 24/7 use the Python version in paper_trader/."} Paper results do not predict live results. New-token trading is extremely high risk.</div>`;
  $("setcard").innerHTML=h;
  for(const [k,,lo,hi] of RK)$("s_"+k).oninput=e=>{const v=clamp(+e.target.value,lo,hi);CFG.risk[k]=v;$("v_"+k).textContent=v;const o={};for(const [kk] of RK)o[kk]=CFG.risk[kk];LS.set("pt_risk",JSON.stringify(o))};
  const sp=$("segspeed");if(sp)sp.onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(!v)return;SPEED=+v;LS.set("pt_speed",SPEED);sp.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v))};
  const sm=$("segmode");if(sm)sm.onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(!v||v===MODE)return;MODE=v;LS.set("pt_mode",MODE);boot()};
  $("toggle").onclick=()=>{paused=!paused;$("toggle").textContent=paused?"Resume scanning":"Pause scanning";render()};
  twoTap($("kill"),"Tap again to flatten and halt",()=>{LS.set("pt_kill_"+MODE,"1");tick()});
  $("rearm").onclick=()=>{LS.del("pt_kill_"+MODE);S.pf.shutdown=false;S.pf.why="";S.pf.peak=equity();S.pf.streak=0;save();render()};
  twoTap($("reset"),"Tap again to delete this account",()=>{const c=Math.max(100,+$("cap").value||10000);LS.set("pt_cap",c);LS.del("pt_kill_"+MODE);S=newState(c);resetRuntime();save();if(MODE==="mock")boot();else render()})}
function twoTap(btn,label,fn){const o=btn.textContent;let armed=0;btn.onclick=()=>{if(armed){armed=0;btn.textContent=o;fn();return}armed=1;btn.textContent=label;setTimeout(()=>{armed=0;btn.textContent=o},4000)}}
function resetRuntime(){rejected={};stats=freshStats();regime="unknown";last={};openFeed=new Set()}
function render(){header();({over:rOver,pos:rPos,scan:rScan,stats:rStats,set:()=>{}})[tab]()}

document.getElementById("nav").onclick=e=>{const t=e.target.dataset&&e.target.dataset.t;if(!t)return;tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===e.target));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id==="t-"+t));if(t==="set")buildSettings();render();scrollTo(0,0)};
$("segpos").onclick=e=>{if(e.target.dataset.s){posSeg=e.target.dataset.s;render()}};
$("segscan").onclick=e=>{if(e.target.dataset.s){scanSeg=e.target.dataset.s;render()}};
document.addEventListener("click",e=>{const f=e.target.closest&&e.target.closest("[data-feed]");if(f){const id=f.dataset.feed;openFeed.has(id)?openFeed.delete(id):openFeed.add(id);render()}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.feed){e.preventDefault();e.target.click()}});
async function wake(){try{if(navigator.wakeLock)await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){wake();if(MODE==="live")tick().then(render)}});
function boot(){clearInterval(timer);SEED=MODE==="mock"?(Math.random()*1e9|0):(Date.now()&0xffffff);rng=mulberry(SEED);load();last={};rejected={};stats=freshStats();regime="unknown";
  if(MODE==="mock"){LS.del("pt_kill_mock");vnow=1.76e9;MOCK.init();regimeOk=vnow;S.curve=[[vnow,equity()]];let acc=0;
    timer=setInterval(async()=>{if(busyUI)return;busyUI=true;try{if(!paused){acc+=SPEED*0.25;let n=0;while(acc>=CFG.tick&&n++<80){acc-=CFG.tick;vnow+=CFG.tick;await tick()}}}finally{busyUI=false}render()},250)}
  else{regimeOk=now();if(!S.curve.length)S.curve=[[now(),equity()]];timer=setInterval(async()=>{await tick();render()},CFG.tick*1000);tick().then(render)}
  if(tab==="set")buildSettings();render();wake()}
boot();

</script>
</body>
