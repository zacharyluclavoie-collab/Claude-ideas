name: Deploy Gem Rush to GitHub Pages

# Manual run only: Actions tab, "Deploy Gem Rush to GitHub Pages", Run workflow.
# One-time setup first: repo Settings, Pages, Source = GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir site
          cp index.html manifest.webmanifest icon-180.png icon-192.png icon-512.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
