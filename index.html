<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gem Rush</title>
<meta name="description" content="Tap the gem. Watch it evolve. How far can you go?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one portrait "phone" column (9:16 friendly) = HUD on top, gem stage in the middle, upgrade shelf at the bottom. */
@property --h { syntax: '<number>'; inherits: true; initial-value: 205; }
:root{
  --h: 205;
  --ink: #fff;
  --ink-dim: rgba(255,255,255,.62);
  --ink-faint: rgba(255,255,255,.38);
  --glass: rgba(255,255,255,.065);
  --glass-line: rgba(255,255,255,.13);
  --gold: #ffd23f;
  --font: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05030b;color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
body{display:grid;place-items:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#app{
  --accent: hsl(var(--h) 95% 68%);--accent-2: hsl(calc(var(--h) + 38) 95% 62%);
  position:relative;width:min(100vw,480px);height:100%;max-height:980px;overflow:hidden;
  background:linear-gradient(180deg,#0c0720 0%,#07040f 60%,#05030b 100%);
  display:flex;flex-direction:column;isolation:isolate;
  transition:--h 1.4s ease;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:520px) and (min-height:760px){
  #app{height:min(100%,920px);border-radius:38px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 120px -20px hsl(var(--h) 90% 45% / .35)}
}

/* ambient background */
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:360px;height:360px;left:-120px;top:5%;background:hsl(var(--h) 90% 48%);animation:drift1 14s ease-in-out infinite alternate}
.b2{width:320px;height:320px;right:-130px;top:30%;background:hsl(calc(var(--h) + 55) 90% 52%);animation:drift2 17s ease-in-out infinite alternate}
.b3{width:300px;height:300px;left:10%;bottom:-120px;background:hsl(calc(var(--h) - 45) 90% 45%);animation:drift3 19s ease-in-out infinite alternate;opacity:.4}
@keyframes drift1{to{transform:translate(70px,90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-80px,-60px) scale(1.2)}}
@keyframes drift3{to{transform:translate(90px,-70px) scale(.9)}}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(5,3,11,.75) 100%)}

/* HUD */
.hud{padding:12px 16px 0;display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.row{width:100%;display:flex;align-items:center;justify-content:space-between}
.chip{display:flex;align-items:baseline;gap:8px;padding:6px 14px 6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);align-self:center}
.chip b{font-weight:600;font-size:15px;letter-spacing:.02em}
.chip small{font-size:12px;color:var(--ink-faint);font-weight:500}
.tools{display:flex;gap:6px}
.tools button{width:36px;height:36px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-line);display:grid;place-items:center;transition:transform .15s,background .2s}
.tools button:active{transform:scale(.88)}
.tools button.on{background:hsl(var(--h) 90% 60% / .28);border-color:hsl(var(--h) 90% 70% / .6)}
.tools svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.bal{display:flex;align-items:center;gap:10px;margin-top:6px;will-change:transform;transform-origin:center}
.bal svg{width:38px;height:38px;filter:drop-shadow(0 0 14px var(--accent))}
#bal{font-size:clamp(44px,13vw,64px);font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 30%,hsl(var(--h) 100% 85%));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 22px hsl(var(--h) 100% 60% / .45))}
.sub{font-size:15px;font-weight:500;color:var(--ink-dim);display:flex;gap:6px;align-items:center}
.sub b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.prog{position:relative;width:100%;height:22px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--glass-line);overflow:hidden}
.prog i{position:absolute;inset:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 18px var(--accent)}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{to{transform:translateX(100%)}}
.prog span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* stage */
#stage{position:relative;flex:1;min-height:0;touch-action:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{position:absolute;left:50%;top:6px;transform:translate(-50%,-14px) scale(.9);opacity:0;pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.pill.on{opacity:1;transform:translate(-50%,0) scale(1)}
#comboPill{top:auto;bottom:12px;transform:translate(-50%,16px) scale(.9)}
#comboPill.on{transform:translate(-50%,0) scale(1)}
#combo{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(10,6,24,.55);border:1px solid hsl(var(--h) 100% 75% / .5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;white-space:nowrap}
#combo b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#combo em{font-style:normal;font-weight:600;font-size:14px;color:var(--accent)}
#combo small{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);font-weight:600}
#comboBar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform-origin:left;box-shadow:0 0 8px var(--accent)}
#frenzy{top:46px;display:flex;flex-direction:column;align-items:center;gap:5px}
#frenzyTxt{font-weight:700;font-size:15px;letter-spacing:.08em;color:#2a1500;padding:5px 14px;border-radius:99px;background:linear-gradient(90deg,#ffb100,#ffe45e);box-shadow:0 0 24px rgba(255,190,40,.7);animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.07)}}
#frenzyBar{width:150px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
#frenzyBar i{position:absolute;inset:0;background:#ffd23f;transform-origin:left}
#hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-weight:600;font-size:15px;letter-spacing:.2em;color:#fff;opacity:.9;pointer-events:none;animation:hint 1.2s ease-in-out infinite alternate;text-shadow:0 0 16px var(--accent)}
@keyframes hint{from{transform:translate(-50%,0);opacity:.55}to{transform:translate(-50%,-8px);opacity:1}}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,hsl(var(--h) 100% 80%) 60%,transparent);opacity:0;pointer-events:none}
#banner{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
#banner small{font-size:14px;letter-spacing:.5em;font-weight:600;color:var(--ink-dim);padding-left:.5em}
#banner b{font-size:clamp(46px,14vw,68px);font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,hsl(var(--h) 100% 75%));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px hsl(var(--h) 100% 60%))}
#banner.show{animation:banner 2.4s cubic-bezier(.2,1,.3,1) forwards}
@keyframes banner{0%{opacity:0;transform:scale(.4) translateY(30px)}14%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15) translateY(-20px)}}

/* shop */
#shop{flex:none;height:clamp(200px,37%,330px);display:flex;flex-direction:column;padding:12px 12px 10px;border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border-top:1px solid var(--glass-line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.shop-h{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.shop-h span:last-child{letter-spacing:.04em;text-transform:none;color:var(--ink-faint);font-weight:500}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 4px;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y}
#list::-webkit-scrollbar{display:none}
.card{flex:none;display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px 9px 9px;border-radius:18px;text-align:left;
  background:var(--glass);border:1px solid var(--glass-line);opacity:.5;transition:transform .12s,opacity .3s,border-color .3s,box-shadow .3s,background .3s}
.card:active{transform:scale(.97)}
.card.can{opacity:1;border-color:hsl(var(--h) 100% 72% / .6);background:linear-gradient(100deg,hsl(var(--h) 90% 60% / .2),var(--glass) 70%);box-shadow:0 0 22px -6px var(--accent)}
.card.pop{animation:cardpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes cardpop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,hsl(var(--h) 80% 55% / .55),hsl(calc(var(--h) + 50) 80% 45% / .35));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.meta b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.meta b em{font-style:normal;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink-dim)}
.meta small{font-size:13px;color:var(--ink-dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy{flex:none;display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:13px;background:rgba(0,0,0,.35);border:1px solid var(--glass-line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.card.can .buy{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#12062a;border-color:transparent;box-shadow:0 4px 14px -4px var(--accent)}
.buy svg{width:15px;height:15px}
.card.max .buy{background:none;border:0;color:var(--gold)}

#toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-20px);opacity:0;padding:9px 16px;border-radius:14px;background:rgba(15,9,34,.85);border:1px solid var(--glass-line);font-size:14px;font-weight:500;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .3s,transform .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none;text-align:center;z-index:5;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-height:700px){#shop{height:34%}.hud{padding-top:6px}.bal svg{width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){.blob,.prog i::after,#hint{animation:none}}
</style>
</head>
<body>
<div id="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:hsl(var(--h) 100% 88%)"/>
      <stop offset=".55" style="stop-color:hsl(var(--h) 95% 62%)"/>
      <stop offset="1" style="stop-color:hsl(calc(var(--h) + 30) 90% 42%)"/>
    </linearGradient>
    <symbol id="gem" viewBox="0 0 24 24">
      <path d="M7 3h10l5 6.2L12 21.5 2 9.2z" fill="url(#gg)"/>
      <path d="M2 9.2h20M7 3l-1.6 6.2L12 21.5M17 3l1.6 6.2L12 21.5M9.6 9.2 12 3l2.4 6.2" fill="none" stroke="rgba(255,255,255,.65)" stroke-width=".8" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>
  <div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <header class="hud">
    <div class="row">
      <div class="chip"><i></i><b id="tierName">Quartz</b><small id="tierNum">1/8</small></div>
      <div class="tools">
        <button id="bSound" aria-label="Sound" class="on"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sndWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button id="bDemo" aria-label="Auto play for recording"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg></button>
        <button id="bShare" aria-label="Share"><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
        <button id="bReset" aria-label="Reset progress"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4v4.5H8"/></svg></button>
      </div>
    </div>
    <div class="bal" id="balWrap"><svg><use href="#gem"/></svg><span id="bal">0</span></div>
    <div class="sub"><b id="ps">0</b> gems / sec</div>
    <div class="prog"><i id="progFill"></i><span id="progLbl"></span></div>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="pill" id="comboPill"><div id="combo"><small>COMBO</small><b id="comboN">0</b><em id="comboM">x1.00</em><i id="comboBar"></i></div></div>
    <div class="pill" id="frenzy"><span id="frenzyTxt">FRENZY x7</span><div id="frenzyBar"><i id="frenzyFill"></i></div></div>
    <div id="hint">TAP THE GEM</div>
    <div id="flash"></div>
    <div id="banner"><small>EVOLVED</small><b id="bannerT">EMERALD</b></div>
  </main>

  <section id="shop">
    <div class="shop-h"><span>Upgrades</span><span id="owned"></span></div>
    <div id="list"></div>
  </section>

  <div id="toast"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '700 {S}px Fredoka, ui-rounded, system-ui, sans-serif';

/* ---------- data ---------- */
const TIERS = [
  { name: 'Quartz',   h: 205, s: 45, at: 0,      m: 3, tw: .50 },
  { name: 'Citrine',  h: 42,  s: 95, at: 300,    m: 4, tw: .52 },
  { name: 'Emerald',  h: 152, s: 80, at: 6e3,    m: 4, tw: .48 },
  { name: 'Sapphire', h: 220, s: 90, at: 1.2e5,  m: 5, tw: .55 },
  { name: 'Ruby',     h: 352, s: 88, at: 3e6,    m: 5, tw: .50 },
  { name: 'Amethyst', h: 278, s: 75, at: 8e7,    m: 6, tw: .52 },
  { name: 'Diamond',  h: 190, s: 70, at: 2.5e9,  m: 6, tw: .56 },
  { name: 'Cosmic',   h: 300, s: 90, at: 8e10,   m: 8, tw: .50, cosmic: true },
];
const UPS = [
  { id: 'pick',  name: 'Sharp Pick',    ico: '⛏️', base: 15,     g: 1.34, desc: () => `+${fmt(tapStep())} per tap` },
  { id: 'luck',  name: 'Lucky Cut',     ico: '🍀', base: 120,    g: 1.75, max: 18, desc: () => `Crit chance ${Math.round(critChance() * 100)}%  ·  crits hit x5` },
  { id: 'gob',   name: 'Goblin Miner',  ico: '👺', base: 50,     g: 1.15, rate: 1,      desc: u => `+${fmt(u.rate)} gem / sec each` },
  { id: 'dwarf', name: 'Dwarf Crew',    ico: '⚒️', base: 600,    g: 1.15, rate: 8,      desc: u => `+${fmt(u.rate)} gems / sec each` },
  { id: 'drill', name: 'Gem Drill',     ico: '🤖', base: 7500,   g: 1.15, rate: 60,     desc: u => `+${fmt(u.rate)} gems / sec each` },
  { id: 'reac',  name: 'Crystal Reactor', ico: '⚡', base: 9e4,  g: 1.15, rate: 420,    desc: u => `+${fmt(u.rate)} gems / sec each` },
  { id: 'forge', name: 'Star Forge',    ico: '🌟', base: 1.2e6,  g: 1.15, rate: 3200,   desc: u => `+${fmt(u.rate)} gems / sec each` },
  { id: 'hole',  name: 'Black Hole',    ico: '🕳️', base: 2e7,    g: 1.15, rate: 26000,  desc: u => `+${fmt(u.rate)} gems / sec each` },
];
const COMBO_WINDOW = 1.2, FRENZY_MULT = 7, FRENZY_TIME = 15;

/* ---------- state ---------- */
const KEY = 'gemrush.v1';
let S = { gems: 0, total: 0, up: {}, taps: 0, t: Date.now(), muted: false };
try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && typeof r.gems === 'number') S = Object.assign(S, r); } catch (e) {}
UPS.forEach(u => { if (!S.up[u.id]) S.up[u.id] = 0; });
let tier = 0, frenzy = 0, combo = 0, lastTap = -9, comboPeak = 0, dispGems = S.gems, demo = false;
const save = () => { try { S.t = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- math helpers ---------- */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace(/\.0$/, '') : String(Math.floor(n));
  const i = Math.floor(Math.log10(n) / 3);
  if (i >= SUF.length) return n.toExponential(2).replace('+', '');
  const v = n / Math.pow(1000, i);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + SUF[i];
}
const lvl = id => S.up[id] || 0;
const tapStep = () => 1 + Math.floor(lvl('pick') / 10);
const tapPower = () => 1 + lvl('pick') * tapStep();
const critChance = () => .03 + .025 * lvl('luck');
const baseRate = () => UPS.reduce((s, u) => s + (u.rate ? u.rate * lvl(u.id) : 0), 0);
const perSec = () => baseRate() * (frenzy > 0 ? FRENZY_MULT : 1);
const costOf = u => Math.floor(u.base * Math.pow(u.g, lvl(u.id)));
const comboMult = () => 1 + Math.min(combo, 100) * .02;

/* ---------- audio ---------- */
let AC;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d = .16, type = 'triangle', vol = .12, when = 0, slide = 0) {
  if (!AC || S.muted) return;
  const t0 = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t0 + d);
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + .008);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + .03);
}
const PENT = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
const note = semis => 261.63 * Math.pow(2, semis / 12);
function sndTap(c, crit) {
  const i = c % 18, k = i < 9 ? i : 17 - i;
  const f = note(PENT[k]);
  tone(f, .2, 'triangle', .13); tone(f * 2, .12, 'sine', .05);
  if (crit) { tone(f * 3, .3, 'square', .04, 0, 1.5); tone(note(PENT[k] + 12), .25, 'sine', .08, .04); }
}
const sndBuy = () => { tone(note(12), .1, 'sine', .12); tone(note(19), .16, 'sine', .12, .07); tone(note(24), .22, 'triangle', .1, .14); };

    cd.cost.textContent = maxed ? 'Maxed' : fmt(c);
    cd.buy.querySelector('svg').style.display = maxed ? 'none' : '';
    cd.b.classList.toggle('can', !maxed && S.gems >= c);
    cd.b.classList.toggle('max', !!maxed);
  });
  el.owned.textContent = owned + ' owned';
}

/* ---------- HUD, toast, tools ---------- */
function toast(msg, ms = 2400) { el.toast.textContent = msg; el.toast.classList.add('on'); toastT = ms / 1000; }
function applyMute() {
  $('#bSound').classList.toggle('on', !S.muted);
  $('#sndWave').style.display = S.muted ? 'none' : '';
}
$('#bSound').addEventListener('click', () => { S.muted = !S.muted; applyMute(); audio(); save(); });
$('#bDemo').addEventListener('click', () => {
  demo = !demo; $('#bDemo').classList.toggle('on', demo); audio();
  toast(demo ? 'Auto-play on. Hit record and watch it go.' : 'Auto-play off');
});
$('#bShare').addEventListener('click', async () => {
  const text = `I reached ${TIERS[tier].name} in Gem Rush with ${fmt(Math.floor(S.total))} gems. Can you beat that?`;
  try { if (navigator.share) { await navigator.share({ title: 'Gem Rush', text, url: location.href }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(text + ' ' + location.href); toast('Copied. Paste it anywhere.'); } catch (e) { toast(text, 4000); }
});
let resetArm = 0;
$('#bReset').addEventListener('click', () => {
  if (performance.now() - resetArm < 3000) {
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = { gems: 0, total: 0, up: {}, taps: 0, t: Date.now(), muted: S.muted }; UPS.forEach(u => S.up[u.id] = 0);
    tier = 0; combo = 0; frenzy = 0; dispGems = 0; setTierUI(); refreshShop(true); toast('Progress reset'); resetArm = 0;
  } else { resetArm = performance.now(); toast('Tap reset again to wipe all progress'); }
});
[...document.querySelectorAll('.tools button')].forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));

/* ---------- loop ---------- */
let accAuto = 0, accShop = 0, accSave = 0, demoT = 0, demoBuyT = 2, last = performance.now(), balStr = '', psStr = '';
function update(dt) {
  t += dt;
  // production
  const ps = perSec();
  if (ps > 0) addGems(ps * dt);
  while (tier < TIERS.length - 1 && S.total >= TIERS[tier + 1].at) evolve(false);

  // spring squash + tilt
  sqv += ((1 - sq) * 280 - sqv * 14) * dt; sq += sqv * dt; sq = clamp(sq, .6, 1.25);
  tiltv += ((0 - tilt) * 220 - tiltv * 11) * dt; tilt += tiltv * dt;
  if (!RM) shake = Math.max(0, shake - dt * 48); else shake = 0;
  flashA = Math.max(0, flashA - dt * (flashA > .5 ? 1.4 : 2.5));
  bump = Math.max(0, bump - dt * 5);
  toastT -= dt; if (toastT <= 0) el.toast.classList.remove('on');

  // combo decay
  const now = performance.now() / 1000, since = now - lastTap;
  if (combo > 0 && since > COMBO_WINDOW) combo = 0;
  // frenzy
  if (frenzy > 0) {
    frenzy -= dt; heat = Math.min(1, heat + dt * 3);
    if (Math.random() < dt * 55) add({ k: 'spark', x: GX + rnd(-R, R), y: GY + R * .9, vx: rnd(-30, 30), vy: rnd(-260, -120), g: -60, drag: .8, life: rnd(.5, 1), max: 1, sz: rnd(3, 6), h: rnd(15, 48) });
    if (frenzy <= 0) { frenzy = 0; toast('Frenzy over. Nice run!'); }
  } else heat = Math.max(0, heat - dt * 2);

  // auto-mining visuals
  accAuto += dt;
  if (baseRate() > 0 && accAuto > .55) {
    accAuto = 0;
    const a = rnd(-Math.PI * .85, -Math.PI * .15), rr = R * rnd(1.05, 1.5);
    const gain = Math.max(1, Math.round(ps * .55));
    floatText(GX + Math.cos(a) * rr, GY + Math.sin(a) * rr * .8, '+' + fmt(gain), { sz: 20, col: hsl(tierHue(), 100, 82), vy: -60, life: .9, max: .9 });
    add({ k: 'spark', x: GX + Math.cos(a) * rr, y: GY + Math.sin(a) * rr * .8, vx: 0, vy: -20, g: 0, drag: 1, life: .5, max: .5, sz: 4, h: tierHue() });
  }

  // golden gem
  goldTimer -= dt;
  if (!gold && goldTimer <= 0 && frenzy <= 0) spawnGold();
  else if (!gold && goldTimer <= 0) goldTimer = 5;
  if (gold) { gold.t += dt; gold.x += gold.vx * dt; if (gold.x < -70 || gold.x > W + 70) { gold = null; goldTimer = rnd(20, 35); } }

  // demo bot
  if (demo) {
    demoT -= dt;
    if (demoT <= 0) {
      demoT = rnd(.085, .14);
      const a = rnd(0, TAU), rr = rnd(0, R * .7);
      doTap(GX + Math.cos(a) * rr, GY + Math.sin(a) * rr * .8, true);
    }
    demoBuyT -= dt;
    if (demoBuyT <= 0) {
      demoBuyT = rnd(1.2, 2);
      const opts = UPS.filter(u => (!u.max || lvl(u.id) < u.max) && S.gems >= costOf(u));
      if (opts.length) buy(opts[opts.length - 1], false);
    }
    if (gold && gold.t > .8) collectGold();
  }

  updateParticles(dt);

  // HUD
  dispGems += (S.gems - dispGems) * Math.min(1, dt * 14);
  if (Math.abs(S.gems - dispGems) < 1) dispGems = S.gems;
  const bs = fmt(Math.floor(dispGems)); if (bs !== balStr) { balStr = bs; el.bal.textContent = bs; }
  const pss = fmt(ps); if (pss !== psStr) { psStr = pss; el.ps.textContent = pss; }
  el.balWrap.style.transform = `scale(${1 + bump * .07})`;
  const cur = TIERS[tier], nxt = TIERS[tier + 1];
  if (nxt) {
    const f = clamp((S.total - cur.at) / (nxt.at - cur.at), 0, 1);
    el.fill.style.width = (f * 100).toFixed(1) + '%';
    el.lbl.textContent = `${fmt(Math.floor(S.total))} / ${fmt(nxt.at)}  ·  next: ${nxt.name}`;
  } else { el.fill.style.width = '100%'; el.lbl.textContent = `${fmt(Math.floor(S.total))} gems  ·  max tier`; }
  const showCombo = combo >= 3;
  el.comboPill.classList.toggle('on', showCombo);
  if (showCombo) {
    el.comboN.textContent = combo; el.comboM.textContent = 'x' + comboMult().toFixed(2);
    el.comboBar.style.transform = `scaleX(${clamp(1 - since / COMBO_WINDOW, 0, 1)})`;
  }
  el.frenzy.classList.toggle('on', frenzy > 0);
  if (frenzy > 0) el.frenzyFill.style.transform = `scaleX(${frenzy / FRENZY_TIME})`;
  el.flash.style.opacity = flashA.toFixed(3);

  accShop += dt; if (accShop > .12) { accShop = 0; refreshShop(false); }
  accSave += dt; if (accSave > 5) { accSave = 0; save(); }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const T = TIERS[tier], hue = T.cosmic ? (t * 40) % 360 : T.h;
  ctx.save();
  if (shake > .1) ctx.translate(rnd(-shake, shake) * .6, rnd(-shake, shake) * .6);
  drawBackdrop(t, hue, heat);
  drawOrbiters(t, hue, false);
  drawGem(t, tier, tilt, sq);
  drawOrbiters(t, hue, true);
  drawParticles(t);
  drawGold(t);
  ctx.restore();
}
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(function boot() {
  while (tier < TIERS.length - 1 && S.total >= TIERS[tier + 1].at) tier++;
  setTierUI(); applyMute();
  // offline progress
  const away = Math.min((Date.now() - (S.t || Date.now())) / 1000, 8 * 3600);
  const rate = baseRate();
  if (away > 60 && rate > 0) {
    const gain = Math.floor(rate * away * .5); addGems(gain); dispGems = S.gems - gain;
    setTimeout(() => toast(`Welcome back! Your miners found ${fmt(gain)} gems`, 3500), 600);
  }
  if (S.taps > 0) el.hint.style.display = 'none';
  refreshShop(true);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  addEventListener('pagehide', save);
  requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });
  // test/recording hooks
  window.__gem = { S: () => S, tap: (x, y) => doTap(x ?? GX, y ?? GY, true), addGems, buy: id => buy(UPS.find(u => u.id === id)), demo: v => { demo = v; }, spawnGold };
})();
})();
</script>
</body>
</html>
