<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gem Rush</title>
<meta name="description" content="Tap the gem. Watch it evolve. How far can you go?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one portrait "phone" column (9:16 friendly) = HUD on top, gem stage in the middle, upgrade shelf at the bottom. */
@property --h { syntax: '<number>'; inherits: true; initial-value: 205; }
:root{
  --h: 205;
  --ink: #fff;
  --ink-dim: rgba(255,255,255,.62);
  --ink-faint: rgba(255,255,255,.38);
  --glass: rgba(255,255,255,.065);
  --glass-line: rgba(255,255,255,.13);
  --gold: #ffd23f;
  --font: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05030b;color:var(--ink);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
body{display:grid;place-items:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#app{
  --accent: hsl(var(--h) 95% 68%);--accent-2: hsl(calc(var(--h) + 38) 95% 62%);
  position:relative;width:min(100vw,480px);height:100%;max-height:980px;overflow:hidden;
  background:linear-gradient(180deg,#0c0720 0%,#07040f 60%,#05030b 100%);
  display:flex;flex-direction:column;isolation:isolate;
  transition:--h 1.4s ease;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (min-width:520px) and (min-height:760px){
  #app{height:min(100%,920px);border-radius:38px;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 120px -20px hsl(var(--h) 90% 45% / .35)}
}

/* ambient background */
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;opacity:.7;will-change:transform}
.b1{width:520px;height:520px;left:-200px;top:0;background:radial-gradient(circle,hsl(var(--h) 90% 50% / .75),transparent 66%);animation:drift1 14s ease-in-out infinite alternate}
.b2{width:480px;height:480px;right:-220px;top:22%;background:radial-gradient(circle,hsl(calc(var(--h) + 55) 90% 54% / .7),transparent 66%);animation:drift2 17s ease-in-out infinite alternate}
.b3{width:460px;height:460px;left:0;bottom:-220px;background:radial-gradient(circle,hsl(calc(var(--h) - 45) 90% 48% / .6),transparent 66%);animation:drift3 19s ease-in-out infinite alternate;opacity:.6}
@keyframes drift1{to{transform:translate(70px,90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-80px,-60px) scale(1.2)}}
@keyframes drift3{to{transform:translate(90px,-70px) scale(.9)}}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgba(5,3,11,.75) 100%)}

/* HUD */
.hud{padding:12px 16px 0;display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.row{width:100%;display:flex;align-items:center;justify-content:space-between}
.chip{display:flex;align-items:baseline;gap:8px;padding:6px 14px 6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);align-self:center}
.chip b{font-weight:600;font-size:15px;letter-spacing:.02em}
.chip small{font-size:12px;color:var(--ink-faint);font-weight:500}
.tools{display:flex;gap:6px}
.tools button{width:36px;height:36px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-line);display:grid;place-items:center;transition:transform .15s,background .2s}
.tools button:active{transform:scale(.88)}
.tools button.on{background:hsl(var(--h) 90% 60% / .28);border-color:hsl(var(--h) 90% 70% / .6)}
.tools svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.bal{display:flex;align-items:center;gap:10px;margin-top:6px;will-change:transform;transform-origin:center}
.bal svg{width:38px;height:38px;filter:drop-shadow(0 0 14px var(--accent))}
#bal{font-size:clamp(44px,13vw,64px);font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff 30%,hsl(var(--h) 100% 85%));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 22px hsl(var(--h) 100% 60% / .45))}
.sub{font-size:15px;font-weight:500;color:var(--ink-dim);display:flex;gap:6px;align-items:center}
.sub b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.prog{position:relative;width:100%;height:22px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--glass-line);overflow:hidden}
.prog i{position:absolute;inset:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent-2),var(--accent));box-shadow:0 0 18px var(--accent)}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite}
@keyframes shine{to{transform:translateX(100%)}}
.prog span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* stage */
#stage{position:relative;flex:1;min-height:0;touch-action:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{position:absolute;left:50%;top:6px;transform:translate(-50%,-14px) scale(.9);opacity:0;pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1)}
.pill.on{opacity:1;transform:translate(-50%,0) scale(1)}
#comboPill{top:auto;bottom:12px;transform:translate(-50%,16px) scale(.9)}
#comboPill.on{transform:translate(-50%,0) scale(1)}
#combo{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(10,6,24,.55);border:1px solid hsl(var(--h) 100% 75% / .5);overflow:hidden;white-space:nowrap}
#combo b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#combo em{font-style:normal;font-weight:600;font-size:14px;color:var(--accent)}
#combo small{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);font-weight:600}
#comboBar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accent);transform-origin:left;box-shadow:0 0 8px var(--accent)}
#frenzy{top:46px;display:flex;flex-direction:column;align-items:center;gap:5px}
#frenzyTxt{font-weight:700;font-size:15px;letter-spacing:.08em;color:#2a1500;padding:5px 14px;border-radius:99px;background:linear-gradient(90deg,#ffb100,#ffe45e);box-shadow:0 0 24px rgba(255,190,40,.7);animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.07)}}
#frenzyBar{width:150px;height:4px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
#frenzyBar i{position:absolute;inset:0;background:#ffd23f;transform-origin:left}
#hint{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-weight:600;font-size:15px;letter-spacing:.2em;color:#fff;opacity:.9;pointer-events:none;animation:hint 1.2s ease-in-out infinite alternate;text-shadow:0 0 16px var(--accent)}
@keyframes hint{from{transform:translate(-50%,0);opacity:.55}to{transform:translate(-50%,-8px);opacity:1}}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff,hsl(var(--h) 100% 80%) 60%,transparent);opacity:0;pointer-events:none}
#banner{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
#banner small{font-size:14px;letter-spacing:.5em;font-weight:600;color:var(--ink-dim);padding-left:.5em}
#banner b{font-size:clamp(46px,14vw,68px);font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,hsl(var(--h) 100% 75%));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px hsl(var(--h) 100% 60%))}
#banner.show{animation:banner 2.4s cubic-bezier(.2,1,.3,1) forwards}
@keyframes banner{0%{opacity:0;transform:scale(.4) translateY(30px)}14%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15) translateY(-20px)}}

/* shop */
#shop{flex:none;height:clamp(200px,37%,330px);display:flex;flex-direction:column;padding:12px 12px 10px;border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border-top:1px solid var(--glass-line);
  box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.shop-h{display:flex;justify-content:space-between;align-items:center;padding:0 6px 8px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.shop-h span:last-child{letter-spacing:.04em;text-transform:none;color:var(--ink-faint);font-weight:500}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 4px;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y}
#list::-webkit-scrollbar{display:none}
.card{flex:none;display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px 9px 9px;border-radius:18px;text-align:left;
  background:var(--glass);border:1px solid var(--glass-line);opacity:.5;transition:transform .12s,opacity .3s,border-color .3s,box-shadow .3s,background .3s}
.card:active{transform:scale(.97)}
.card.can{opacity:1;border-color:hsl(var(--h) 100% 72% / .6);background:linear-gradient(100deg,hsl(var(--h) 90% 60% / .2),var(--glass) 70%);box-shadow:0 0 22px -6px var(--accent)}
.card.pop{animation:cardpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes cardpop{0%{transform:scale(.94)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,hsl(var(--h) 80% 55% / .55),hsl(calc(var(--h) + 50) 80% 45% / .35));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.meta b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.meta b em{font-style:normal;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--ink-dim)}
.meta small{font-size:13px;color:var(--ink-dim);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buy{flex:none;display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:13px;background:rgba(0,0,0,.35);border:1px solid var(--glass-line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.card.can .buy{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#12062a;border-color:transparent;box-shadow:0 4px 14px -4px var(--accent)}
.buy svg{width:15px;height:15px}
.card.max .buy{background:none;border:0;color:var(--gold)}

#toast{position:absolute;left:50%;bottom:calc(max(200px,min(37%,330px)) + 56px);transform:translate(-50%,20px);opacity:0;padding:9px 16px;border-radius:14px;background:rgba(15,9,34,.85);border:1px solid var(--glass-line);font-size:14px;font-weight:500;transition:opacity .3s,transform .4s cubic-bezier(.2,1.4,.4,1);pointer-events:none;text-align:center;z-index:5;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.clean #toast{bottom:96px}


.tools button{width:34px;height:34px}
.chip small#shards{color:var(--gold);font-weight:700}
.shop-h .rowr{display:flex;gap:6px;align-items:center}
.shop-h .ttl{display:flex;gap:10px;align-items:center;white-space:nowrap}
@media (max-width:350px){.shop-h{letter-spacing:.06em;font-size:12px}.shop-h .ttl{gap:6px}.amt{padding:5px 8px}}
.shop-h .ttl span{letter-spacing:.04em;text-transform:none;color:var(--ink-faint);font-weight:500}
.amt{padding:5px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);font-weight:700;font-size:12px;letter-spacing:.06em;color:#fff;transition:transform .12s}
.amt:active{transform:scale(.9)}
#bAmt{background:hsl(var(--h) 90% 60% / .28);border-color:hsl(var(--h) 90% 70% / .6);min-width:48px}
#ascend{display:none;flex:none;margin:0 2px 8px;padding:11px;border-radius:16px;font-weight:700;font-size:14px;letter-spacing:.04em;color:#fff;
  background:linear-gradient(90deg,#ff9d00,#ff4fa0,#7a5cff);box-shadow:0 0 28px -4px #ff7ac8;animation:throb .8s ease-in-out infinite alternate}
.mile{font-style:normal;font-size:11px;font-weight:700;padding:2px 6px;border-radius:99px;background:linear-gradient(90deg,#ffb100,#ffe45e);color:#2a1500}
.nm{color:var(--gold);opacity:.85}
#timer{display:flex;align-items:center;gap:10px;padding:6px 18px;border-radius:99px;background:rgba(10,6,24,.6);border:1px solid hsl(var(--h) 100% 75% / .5);}
#timer small{font-size:11px;letter-spacing:.16em;color:var(--ink-dim);font-weight:600}
#timer b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#timer.low b{color:#ff5d73;animation:throb .35s ease-in-out infinite alternate}
#overlay{position:absolute;inset:0;z-index:20;display:none;place-items:center;padding:20px}
#overlay.count{pointer-events:none;background:radial-gradient(circle,rgba(5,3,11,.55),rgba(5,3,11,.1))}
#overlay.result{background:rgba(5,3,11,.9);}
#cnt{font-size:min(38vw,170px);font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,hsl(var(--h) 100% 72%));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 40px hsl(var(--h) 100% 60%));animation:cnt .9s cubic-bezier(.2,1.4,.3,1)}
@keyframes cnt{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.7);opacity:0}}
.rcard{width:100%;max-width:340px;padding:24px 20px 20px;border-radius:28px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid var(--glass-line);box-shadow:0 30px 80px -20px hsl(var(--h) 90% 50% / .6);animation:rpop .6s cubic-bezier(.2,1.4,.3,1)}
@keyframes rpop{from{transform:scale(.7) translateY(30px);opacity:0}}
.rcard small{font-size:12px;letter-spacing:.35em;color:var(--ink-dim);font-weight:600}
.rcard h2{font-size:54px;line-height:1.05;margin:6px 0 14px;background:linear-gradient(180deg,#fff,hsl(var(--h) 100% 72%));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px hsl(var(--h) 100% 60% / .8))}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rstats div{padding:10px 4px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--glass-line)}
.rstats b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.rstats span{font-size:11px;color:var(--ink-dim);letter-spacing:.08em;text-transform:uppercase}
.rbest{font-weight:600;color:var(--gold);margin-bottom:14px;font-size:15px}
.rbtn{display:flex;flex-direction:column;gap:8px}
.rbtn button{padding:13px;border-radius:16px;font-weight:700;font-size:16px;background:var(--glass);border:1px solid var(--glass-line);transition:transform .12s}
.rbtn button:active{transform:scale(.96)}
.rbtn button.go{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#12062a;border-color:transparent;box-shadow:0 8px 24px -8px var(--accent)}
.clean #shop{display:none}
.clean .hud{padding-top:16px}
.clean .tools button:not(#bClean){opacity:.0;pointer-events:none}
.clean #bClean{opacity:.5}
.clean #hint{bottom:12%}
#bossBox{display:flex;align-items:center;gap:10px;padding:7px 14px;border-radius:99px;background:rgba(40,4,16,.72);border:1px solid var(--rc,rgba(255,90,110,.75));box-shadow:0 0 26px var(--rc,rgba(255,60,90,.5));animation:throb .45s ease-in-out infinite alternate;}
#bossBox small{font-size:11px;letter-spacing:.16em;color:var(--rc,#ff9aab);font-weight:700;white-space:nowrap}
.hpbar{width:104px;height:10px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:var(--rc,#ff3d6a);transform-origin:left;box-shadow:0 0 12px var(--rc,#ff5577)}
#bossT{font-size:18px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.tools button.half{background:var(--glass);opacity:.8}
@media (max-width:380px){.chip small#tierNum{display:none}}

.lane{position:absolute;top:6px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
.lane .pill,.lane #toast{position:static;transform:none;opacity:1;display:none;transition:none;left:auto;top:auto}
.lane #frenzy{display:none}.lane #timer{display:none}
.lane .pill.on,.lane #toast.on{display:block;animation:pillin .35s cubic-bezier(.2,1.6,.4,1)}
.lane #frenzy.on,.lane #timer.on{display:flex}
.lane #toast{max-width:92%;margin:0}
@keyframes pillin{from{opacity:0;transform:translateY(-12px) scale(.9)}}
#sheet{position:absolute;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(5,3,11,.97)}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 8px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--glass-line)}
.cell.cur{border-color:var(--accent);box-shadow:0 0 18px -4px var(--accent)}
.cell canvas{width:100%;aspect-ratio:1;display:block}
.cell b{font-size:11px;font-weight:600}
.cell span{font-size:10px;color:var(--ink-faint)}
.scard{display:block;width:100%;max-height:64vh;object-fit:contain;border-radius:16px}
/* ---- v7 polish ---- */
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
#app{animation:appin .7s ease-out}
@keyframes appin{from{opacity:0}}
button{transition:transform .22s var(--spring),background .2s,opacity .2s,border-color .2s}
button:active{transform:scale(.94)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{position:relative;overflow:hidden}
.card[hidden]{display:none}
.card::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transform-origin:left;transform:scaleX(var(--p,0));opacity:.85;transition:transform .3s ease,opacity .3s}
.card.can::after,.card.max::after{opacity:0}
.card.pop::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-100%);animation:sweep .6s ease-out}
@keyframes sweep{to{transform:translateX(100%)}}
.card.reveal{animation:reveal .55s var(--spring)}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.95)}}
.card.can{animation:canpulse 2.2s ease-in-out infinite}
@keyframes canpulse{50%{box-shadow:0 0 30px -4px var(--accent)}}
.card.can.pop{animation:cardpop .45s var(--spring)}
.card.can.reveal{animation:reveal .55s var(--spring)}
.prog.near i{animation:nearp .45s ease-in-out infinite alternate}
@keyframes nearp{to{box-shadow:0 0 34px 2px var(--accent)}}
.lane .pill.leaving,.lane #toast.leaving{animation:pillout .24s ease-in forwards}
@keyframes pillout{to{opacity:0;transform:translateY(-10px) scale(.92)}}
#sheet{animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
#comboPill[data-lv="1"] #combo{border-color:#ffb100;box-shadow:0 0 22px -4px #ff9d00}
#comboPill[data-lv="1"] #comboBar{background:#ffb100;box-shadow:0 0 8px #ffb100}
#comboPill[data-lv="1"] #comboM{color:#ffc84a}
#comboPill[data-lv="2"] #combo{border-color:#ff4fa0;box-shadow:0 0 28px -2px #ff4fa0}
#comboPill[data-lv="2"] #comboBar{background:#ff4fa0;box-shadow:0 0 8px #ff4fa0}
#comboPill[data-lv="2"] #comboM{color:#ff7ab8}

</head>
<body>
<div id="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:hsl(var(--h) 100% 88%)"/>

    </symbol>

</svg>
  <div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

  <header class="hud">
    <div class="row">
      <div class="chip"><i></i><b id="tierName">Quartz</b><small id="tierNum">1/8</small><small id="shards" hidden></small><small id="shd" hidden></small></div>
      <div class="tools">
        <button id="bSound" aria-label="Sound" class="on"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="sndWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button id="bDemo" aria-label="Auto play for recording"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg></button>

        <button id="bChal" aria-label="60 second speedrun"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 2.5h5"/></svg></button>

    <div class="shop-h"><div class="ttl">Upgrades <span id="achN"></span></div><div class="rowr"><button class="amt" id="bAmt">x1</button><button class="amt" id="bColl">Gems</button><button class="amt" id="bReset">Reset</button><button class="amt" id="closeShop" aria-label="Close upgrades"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '700 {S}px Fredoka, ui-rounded, system-ui, sans-serif';

/* ---------- data ---------- */
const TIERS = [
  { name: 'Quartz',   h: 205, s: 45, at: 0,      shape: 'crystal' },
  { name: 'Citrine',  h: 42,  s: 95, at: 200,    shape: 'brilliant', m: 4, tw: .52 },
  { name: 'Emerald',  h: 152, s: 80, at: 2.5e3,  shape: 'emerald' },
  { name: 'Sapphire', h: 220, s: 90, at: 3e4,    shape: 'round', n: 10 },
  { name: 'Ruby',     h: 352, s: 88, at: 4e5,    shape: 'heart' },
  { name: 'Amethyst', h: 278, s: 75, at: 5e6,    shape: 'marquise' },
  { name: 'Diamond',  h: 190, s: 70, at: 8e7,    shape: 'brilliant', m: 6, tw: .56 },
  { name: 'Cosmic',   h: 300, s: 90, at: 1.2e9,  shape: 'star', n: 8, cosmic: true },
];
const UPS = [
  { id: 'pick',  name: 'Sharp Pick',    ico: '⛏️', base: 15,     g: 1.34, desc: () => `+${fmt(upMult('pick') * globalMult())} per tap, per level` },
  { id: 'luck',  name: 'Lucky Cut',     ico: '🍀', base: 120,    g: 1.75, max: 18, desc: () => `Crit chance ${Math.round(critChance() * 100)}%  ·  crits hit x5` },
  { id: 'gob',   name: 'Goblin Miner',  ico: '👺', base: 50,     g: 1.15, rate: 1,      desc: autoDesc },
  { id: 'dwarf', name: 'Dwarf Crew',    ico: '⚒️', base: 600,    g: 1.15, rate: 10,      desc: autoDesc },
  { id: 'drill', name: 'Gem Drill',     ico: '🤖', base: 7500,   g: 1.15, rate: 110,     desc: autoDesc },
  { id: 'reac',  name: 'Crystal Reactor', ico: '⚡', base: 9e4,  g: 1.15, rate: 1300,    desc: autoDesc },
  { id: 'forge', name: 'Star Forge',    ico: '🌟', base: 1.2e6,  g: 1.15, rate: 16000,   desc: autoDesc },
  { id: 'hole',  name: 'Black Hole',    ico: '🕳️', base: 2e7,    g: 1.15, rate: 200000,  desc: autoDesc },
  { id: 'hammer', name: 'Crack Hammer',  ico: '🔨', base: 400,   g: 1.35, max: 25, gate: () => rareGate(), desc: () => `Taps hit rare gems for ${1 + lvl('hammer')} (+1 each level)` },
  { id: 'bit',    name: 'Drill Bit',     ico: '🪚', base: 2500,  g: 1.38, max: 25, gate: () => rareGate(), desc: () => `Drills rare gems for ${(lvl('bit') * .6).toFixed(1)} dmg / sec on its own` },
  { id: 'warp',   name: 'Time Warp',     ico: '⏳', base: 8000,  g: 1.6,  max: 10, gate: () => rareGate(), desc: () => `+${(lvl('warp') * 1.5).toFixed(1)}s to break a rare gem` },
  { id: 'radar',  name: 'Treasure Radar', ico: '📡', base: 20000, g: 1.5, max: 15, gate: () => rareGate(), desc: () => `Rarer gems x${(1 + .25 * lvl('radar')).toFixed(2)}, ${Math.round((1 - Math.pow(.97, lvl('radar'))) * 100)}% sooner` },
];
function rareGate() { return (S.bosses || 0) >= 1 || tier >= 2; }
function autoDesc(u) { return `+${fmt(u.rate * upMult(u.id) * globalMult())} gems / sec each`; }
const MILES = [10, 25, 50, 100, 150, 200];
const NOMILE = new Set(['luck', 'hammer', 'bit', 'warp', 'radar']);
const RAR = [
  { name: 'Common',    w: 62,   hp: 1,   t: 0, pay: 1,   h: 210, s: 20,  l: 82 },
  { name: 'Uncommon',  w: 22,   hp: 1.6, t: 1, pay: 2, h: 140, s: 70,  l: 60 },
  { name: 'Rare',      w: 10,   hp: 2.5, t: 2, pay: 5,   h: 212, s: 100, l: 62 },
  { name: 'Epic',      w: 4,    hp: 4,   t: 3, pay: 12,  h: 275, s: 100, l: 68 },
  { name: 'Legendary', w: 1.5,  hp: 7,   t: 4, pay: 30,  h: 45,  s: 100, l: 58 },
  { name: 'Mythic',    w: .45,  hp: 12,  t: 5, pay: 90, h: 350, s: 100, l: 62 },
  { name: 'Secret',    w: .1,   hp: 20,  t: 7, pay: 400, h: 0,   s: 100, l: 60, rainbow: true },
];
const rare = r => (S.rare && S.rare[r]) || 0;
const rarCol = (r, t) => { const R = RAR[r]; return [R.rainbow ? (t * 120) % 360 : R.h, R.s, R.l]; };
function rollRarity() {
  const k = 1 + .25 * lvl('radar'); const ws = RAR.map((r, i) => i ? r.w * k : r.w);
  let x = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ws.length; i++) { x -= ws[i]; if (x <= 0) return i; }
  return 0;
}
const ASC_AT = 3e9;
const ACH = [
  ['t100', 'Warming up', '100 taps', () => S.taps >= 100],
  ['t1k', 'Finger of steel', '1,000 taps', () => S.taps >= 1000],
  ['c25', 'On a roll', 'Combo 25', () => comboPeak >= 25],
  ['c100', 'Untouchable', 'Combo 100', () => comboPeak >= 100],
  ['fr', 'Golden touch', 'Catch a golden gem', () => (S.fr || 0) >= 1],
  ['k1', 'Millionaire', '1M gems', () => S.total >= 1e6],
  ['b1', 'Billionaire', '1B gems', () => S.total >= 1e9],
  ['t3', 'Blue blood', 'Reach Sapphire', () => tier >= 3],
  ['t5', 'Violet hour', 'Reach Amethyst', () => tier >= 5],
  ['t7', 'Out of this world', 'Reach Cosmic', () => tier >= 7],
  ['as', 'Reborn', 'Ascend once', () => (S.shards || 0) > 0],
  ['bo', 'Gem breaker', 'Beat a boss gem', () => (S.bosses || 0) >= 1],
  ['rn', 'Rainmaker', 'Catch 100 rain gems', () => (S.rains || 0) >= 100],
  ['rr', 'Treasure hunter', 'Break a Rare or better gem', () => [2, 3, 4, 5, 6].some(rare)],
  ['rl', 'Golden moment', 'Break a Legendary gem', () => rare(4) > 0],
  ['rs', 'The impossible', 'Break the Secret gem', () => rare(6) > 0],
];
const COMBO_WINDOW = 1.2, FRENZY_MULT = 7, FRENZY_TIME = 15;

/* ---------- state ---------- */
const KEY = 'gemrush.v1';
const newState = () => ({ gems: 0, total: 0, up: Object.fromEntries(UPS.map(u => [u.id, 0])), taps: 0, t: Date.now(), snd: 0, shards: 0, ach: {}, fr: 0, bosses: 0, rains: 0, day: '', streak: 0, maxTier: 0, tips: {}, rare: {}, shd: 0, rgb: true });
let S = newState();
try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && typeof r.gems === 'number') S = Object.assign(S, r); } catch (e) {}
UPS.forEach(u => { if (!S.up[u.id]) S.up[u.id] = 0; });
let boss = null, rain = null, bossT = 22, rainT = 55, KS = 0, chal = null, amt = 1, tier = 0, frenzy = 0, combo = 0, lastTap = -9, comboPeak = 0, dispGems = S.gems, demo = false;
const save = () => { if (chal) return; try { S.t = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- math helpers ---------- */
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace(/\.0$/, '') : String(Math.floor(n));
  const i = Math.floor(Math.log10(n) / 3);
  if (i >= SUF.length) return n.toExponential(2).replace('+', '');
  const v = n / Math.pow(1000, i);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)) + SUF[i];
}
const lvl = id => S.up[id] || 0;
const mileCount = id => MILES.filter(m => lvl(id) >= m).length;
const upMult = id => NOMILE.has(id) ? 1 : Math.pow(2, mileCount(id));
const nextMile = id => NOMILE.has(id) ? 0 : (MILES.find(m => lvl(id) < m) || 0);
const achCount = () => Object.keys(S.ach || {}).length;
const globalMult = () => chal ? 1 : 1 + .05 * (S.shards || 0) + .02 * achCount() + .0004 * (S.shd || 0);

  sheet.innerHTML = `<div class="rcard" style="padding:14px"><img class="scard" src="${sheetURL}" alt="Your Gem Rush share card"><div class="rbtn" style="margin-top:12px"><button class="go" id="sShare">Share</button><button id="sClose">Close</button></div></div>`;
  $('#sClose').onclick = closeSheet;

}

/* ---------- 60s speedrun challenge ---------- */
const CHAL_TIME = 60;
let chalBest = {};
try { chalBest = JSON.parse(localStorage.getItem('gemrush.best') || '{}') || {}; } catch (e) {}
const overlay = $('#overlay');
function startChallenge() {
  const backup = chal ? chal.backup : S;
  chal = { phase: 'count', cd: 4, t: CHAL_TIME, backup, lastNum: -1 };
  S = newState(); S.snd = backup.snd;
  tier = 0; combo = 0; comboPeak = 0; frenzy = 0; dispGems = 0; gold = null; goldTimer = 9; P.length = 0; clearEvents();
  setTierUI(); refreshShop(true); refreshMeta();
  el.app.classList.add('chal'); el.timerN.textContent = CHAL_TIME; el.timer.classList.remove('low'); pill(el.timer, true);
  overlay.className = 'count'; overlay.innerHTML = '<b id="cnt"></b>'; overlay.style.display = 'grid';

function chalTick(dt) {

      sndTick(n === 0); vib(n === 0 ? 40 : 15);
    }
    if (chal.phase === 'count' && chal.cd <= 1) chal.phase = 'run';
    if (chal.cd <= -.5) overlay.style.display = 'none';
  }
  if (chal.phase === 'run') {

    if (el.timerN.textContent !== String(sec)) { el.timerN.textContent = sec; if (sec <= 10 && sec > 0) tone(note(sec % 2 ? 19 : 16), .08, 'square', .05); }
    el.timer.classList.toggle('low', sec <= 10);

}
function endChallenge() {
  chal.phase = 'done'; pill(el.timer, false);
  const total = Math.floor(S.total), name = TIERS[tier].name;
  const nb = total > (chalBest.total || 0);
  if (nb) { chalBest = { total, tier: name }; try { localStorage.setItem('gemrush.best', JSON.stringify(chalBest)); } catch (e) {} }

  overlay.innerHTML = `<div class="rcard"><small>TIME'S UP</small><h2>${name}</h2>
    <div class="rstats"><div><b>${fmt(total)}</b><span>Gems</span></div><div><b>${S.taps}</b><span>Taps</span></div><div><b>${comboPeak}</b><span>Combo</span></div></div>
    <div class="rbest">${nb ? 'NEW PERSONAL BEST' : 'Best: ' + fmt(chalBest.total || 0) + ' (' + (chalBest.tier || '-') + ')'}</div>

}
function exitChallenge() {

  tier = 0; while (tier < TIERS.length - 1 && S.total >= TIERS[tier + 1].at) tier++;

$('#bChal').addEventListener('click', () => { audio(); if (chal) { exitChallenge(); return; } startChallenge(); });

/* ---------- loop ---------- */

  // frenzy

    if (frenzy <= 0) { frenzy = 0; toast('Frenzy over. Nice run!'); }
  } else heat = Math.max(0, heat - dt * 2);

  updateWheel(dt);
  updateEvents(dt);
  // combo fire + shooting stars

    if (Math.random() < dt * rate) add({ k: 'spark', x: GX + rnd(-R * .9, R * .9), y: GY + R * rnd(.2, .9), vx: rnd(-25, 25), vy: rnd(-230, -110), g: -80, drag: .8, life: rnd(.4, .8), max: .8, sz: rnd(3, 6), h: tierHue() + rnd(-20, 40) });
  }
  if (Math.random() < dt * .22) { const dir = Math.random() < .5 ? 1 : -1; add({ k: 'streak', x: dir > 0 ? rnd(0, W * .5) : rnd(W * .5, W), y: rnd(0, H * .3), vx: dir * rnd(500, 800), vy: rnd(200, 380), g: 0, drag: 0, life: .55, max: .55 }); }
  // auto-mining visuals

    const gain = Math.max(1, Math.round(ps * .55));

    add({ k: 'spark', x: GX + Math.cos(a) * rr, y: GY + Math.sin(a) * rr * .8, vx: 0, vy: -20, g: 0, drag: 1, life: .5, max: .5, sz: 4, h: tierHue() });
  }

  else if (!gold && goldTimer <= 0) goldTimer = 5;
  if (gold) { gold.t += dt; gold.x += gold.vx * dt; if (gold.x < -70 || gold.x > W + 70) { gold = null; goldTimer = rnd(20, 35); } }

  // demo bot

    demoT -= dt;
    if (demoT <= 0) {
      demoT = rnd(.085, .14);
      const a = rnd(0, TAU), rr = rnd(0, R * .7);
      doTap(GX + Math.cos(a) * rr, GY + Math.sin(a) * rr * .8, true);

        let best = null, bv = 0;

          if (u.max && lvl(u.id) >= u.max) return;
          const c = costOf(u); if (S.gems < c) return;

  // HUD

  const pss = fmt(ps); if (pss !== psStr) { psStr = pss; el.ps.textContent = pss; }

  accSave += dt; if (accSave > 5) { accSave = 0; save(); }
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const T = TIERS[tier], hue = T.cosmic ? (t * 40) % 360 : T.h;
  ctx.save();
  if (shake > .1) ctx.translate(rnd(-shake, shake) * .6, rnd(-shake, shake) * .6);
  const SK = window.__skip || {};
  const hidden = wheel && wheel.state === 'spin';
  if (!SK.back && !hidden) drawBackdrop(t, hue, heat);
  if (!SK.orb && !hidden) drawOrbiters(t, hue, false);
  if (!SK.gem && !hidden) drawGem(t, tier, tilt, sq);
  if (!SK.orb && !hidden) drawOrbiters(t, hue, true);
  if (!SK.part) drawParticles(t);
  drawRain();
  drawGold(t);
  ctx.restore();
}
let ema = 16.7, qAcc = 0;
function setQ(n) { Q = n; DPRCAP = [1, 1.5, 2][n]; maxP = [140, 260, 420][n]; resize(); }
function frame(ts) {

  if (raw < 120) ema = ema * .96 + raw * .04;
  qAcc += dt; if (qAcc > 2.5) { qAcc = 0; if (ema > 36 && Q > 0 && !document.hidden) { setQ(Q - 1); ema = 20; } }
  update(dt); draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
(function boot() {
  while (tier < TIERS.length - 1 && S.total >= TIERS[tier + 1].at) tier++;
  S.maxTier = Math.max(S.maxTier || 0, tier); if (!S.tips) S.tips = {}; sq = .45; sqv = 0;
  setTierUI(); applyMute(); applyRgb();
  // offline progress
  const away = Math.min((Date.now() - (S.t || Date.now())) / 1000, 8 * 3600);
  const rate = baseRate();
  if (away > 60 && rate > 0) {
    const gain = Math.floor(rate * away * .5); addGems(gain); dispGems = S.gems - gain;
    setTimeout(() => toast(`Welcome back! Your miners found ${fmt(gain)} gems`, 3500), 600);
  }
  const today = new Date().toDateString();
  if (S.day !== today) {
    const yest = new Date(Date.now() - 864e5).toDateString();
    S.streak = S.day === yest ? (S.streak || 0) + 1 : 1; S.day = today;
    const gift = Math.floor(Math.max(100, baseRate() * 600) * Math.min(S.streak, 7));
    addGems(gift); dispGems = S.gems - gift;
    setTimeout(() => { toast(`Daily gift, day ${S.streak}: +${fmt(gift)} gems`, 3200); confetti(GX, GY, 40); sndBuy(); }, away > 60 && rate > 0 ? 4300 : 900);
  }
  if (S.taps > 0) hideHint();
  refreshShop(true); refreshMeta();
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); return; }
    if (AC && AC.state === 'suspended') AC.resume();
    if (hiddenAt) {

      if (!chal && gone > 20 && baseRate() > 0) { const g = Math.floor(baseRate() * gone * .5); addGems(g); toast(`While you were away: +${fmt(g)} gems`, 3200); }
    }

  requestAnimationFrame(ts => { last = ts; requestAnimationFrame(frame); });

  window.__gem = { skipWheel: () => { if (!wheel) return; if (wheel.state === 'spin') { wheel.t = wheel.dur; updateWheel(0); } closeWheel(); }, wheelInfo: () => wheel && { r: wheel.r, state: wheel.state }, bossInfo: () => boss && { hp: boss.hp, max: boss.max, t: boss.t, r: boss.r }, step: sec => { for (let i = 0; i < sec * 30; i++) update(1 / 30); }, roll: rollRarity, icon: (size, ti) => { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), T = TIERS[ti], hue = T.cosmic ? 300 : T.h; const bg = x.createLinearGradient(0, 0, size, size); bg.addColorStop(0, '#1d1048'); bg.addColorStop(1, '#05030b'); x.fillStyle = bg; x.fillRect(0, 0, size, size); const gl = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size * .55); gl.addColorStop(0, hsl(hue, 100, 55, .65)); gl.addColorStop(1, hsl(hue, 100, 45, 0)); x.fillStyle = gl; x.fillRect(0, 0, size, size); withCanvas(x, size, size, size / 2, size * .5, size * .29, () => { drawBackdrop(1, hue, 0); drawGem(1.1, ti, 0, 1); }); return c.toDataURL('image/png'); }, coll: () => showCollection(), card: () => showShareCard({ ti: tier, title: TIERS[tier].name.toUpperCase(), l1: fmt(Math.floor(S.total)) + ' gems', l2: 'and still tapping', text: 'x' }), nodes: () => ({ AC, MUS, SFX }), q: () => Q, boss: startBoss, rain: startRain, setTier: n => { tier = n; setTierUI(); }, evoLog, sim: sec => { demo = true; for (let i = 0; i < sec * 30; i++) update(1 / 30); }, tierNow: () => tier, startChal: startChallenge, S: () => S, tap: (x, y) => doTap(x ?? GX, y ?? GY, true), addGems, buy: id => buy(UPS.find(u => u.id === id)), demo: v => { demo = v; }, spawnGold };
})();
})();
